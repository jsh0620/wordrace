<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>wordrace</title>
<meta name="description" content="Type random English words to score points for your country in a real-time global typing race." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wr-app" id="app" data-theme="light">
    <header class="wr-header">
      <div class="wr-brand">wordrace</div>
      <div class="wr-header-right">
        <span class="wr-country-badge" id="country-badge" hidden></span>
        <button class="wr-theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="wr-main">
      <aside class="wr-leaderboard">
        <h2>Ranking</h2>
        <ol class="wr-lb-list" id="leaderboard-list"></ol>
        <div class="wr-lb-mine-section" id="my-country-wrap" hidden></div>
      </aside>

      <section class="wr-arena">
        <div class="wr-score-display" id="stat-score">0</div>

        <div class="wr-word-display" id="word-display"></div>

        <input
          class="wr-input"
          id="word-input"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          disabled
        />
      </section>
    </main>

    <div class="wr-modal-overlay" id="picker-overlay">
      <div class="wr-modal">
        <h2 id="picker-title">Select your country</h2>
        <div class="wr-country-grid" id="country-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
